version: '3.8'

services:
  # Speech-to-Text Service
  voice-stt:
    build:
      context: ./stt_service
      dockerfile: Dockerfile
    container_name: voice-stt
    env_file: stt_service/.env
    environment:
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./logs/stt:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "<http://localhost:8000/health>"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - voice-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Text-to-Speech Service
  voice-tts:
    build:
      context: ./tts_service
      dockerfile: Dockerfile
    container_name: voice-tts
    env_file: tts_service/.env
    environment:
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./logs/tts:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "<http://localhost:8001/health>"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - voice-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Language Model Service - Qwen 2.5 7B AWQ Quantized ⭐
  voice-llm:
    build:
      context: ./llm_service
      dockerfile: Dockerfile
    container_name: voice-llm
    env_file: llm_service/.env
    environment:
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./logs/llm:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "<http://localhost:8002/health>"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Longer start time for model loading
    networks:
      - voice-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy
  voice-nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: voice-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./logs/nginx:/var/log/nginx
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - voice-stt
      - voice-tts
      - voice-llm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "<http://localhost/health>"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - voice-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  voice-network:
    driver: bridge

volumes:
  logs:
    driver: local
